<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>{{big_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--void:#05070a;--surface:rgba(0,200,255,0.04);--border:rgba(0,200,255,0.18);--accent:#00c8ff;--gold:#c9a84c;--red:#ff3d5a;--amber:#ffab00;--text:#f5f7fb;--text-2:rgba(245,247,251,0.66);--text-3:rgba(245,247,251,0.36);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--void);color:var(--text);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
body.accent-red::before{background-image:linear-gradient(rgba(255,61,90,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,61,90,0.04) 1px,transparent 1px)}
body::after{content:"";position:fixed;top:-300px;right:-300px;width:700px;height:700px;background:radial-gradient(circle,rgba(0,200,255,0.18) 0%,transparent 70%);pointer-events:none}
body.accent-red::after{background:radial-gradient(circle,rgba(255,61,90,0.20) 0%,transparent 70%)}
body.accent-amber::after{background:radial-gradient(circle,rgba(255,171,0,0.18) 0%,transparent 70%)}
.frame{position:relative;width:100%;height:100%;padding:72px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center}
.kicker{display:flex;align-items:center;gap:14px}
.kicker .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
body.accent-red .kicker .dot{background:var(--red);box-shadow:0 0 18px var(--red)}
body.accent-amber .kicker .dot{background:var(--amber);box-shadow:0 0 18px var(--amber)}
.kicker .label{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3)}
.timestamp{font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);padding:8px 14px;border:1px solid var(--border);border-radius:2px}
body.accent-red .timestamp{color:var(--red);border-color:rgba(255,61,90,0.3)}
body.accent-amber .timestamp{color:var(--amber);border-color:rgba(255,171,0,0.3)}
.deadline{margin-top:18px;font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:0.16em;text-transform:uppercase;color:var(--amber)}
.middle{display:flex;flex-direction:column;justify-content:center;flex:1;padding:48px 0}
.big-number{font-family:"Syne",sans-serif;font-weight:800;font-size:240px;line-height:0.9;letter-spacing:-0.04em;color:var(--accent);margin-bottom:24px}
body.accent-red .big-number{color:var(--red)}
body.accent-amber .big-number{color:var(--amber)}
.big-number-context{font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:0.12em;color:var(--text-2);text-transform:uppercase;margin-bottom:40px}
.headline{font-family:"Syne",sans-serif;font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-0.02em;color:var(--text);max-width:90%}
.headline .accent{color:var(--accent)}
body.accent-red .headline .accent{color:var(--red)}
body.accent-amber .headline .accent{color:var(--amber)}
.bottom{display:flex;flex-direction:column;gap:18px}
.source{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.1em;color:var(--text-3);padding-bottom:16px;border-bottom:1px solid var(--border)}
.footer{display:flex;justify-content:space-between;align-items:end}
.footer .brand{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--text-2);letter-spacing:0.12em}
.footer .author{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase}
</style></head>
<body class="accent-{{accent_class}}">
  <div class="frame">
    <div>
      <div class="top-bar">
        <div class="kicker"><div class="dot"></div><div class="label">{{kicker}}</div></div>
        <div class="timestamp">{{timestamp_text}}</div>
      </div>
      {{deadline_block}}
    </div>
    <div class="middle">
      {{big_number_block}}
      <div class="headline">{{big_title_html}}</div>
    </div>
    <div class="bottom">
      <div class="source">{{source_line}}</div>
      <div class="footer">
        <div class="brand">{{brand}}</div>
        <div class="author">{{author}} · {{domain}}</div>
      </div>
    </div>
  </div>
</body></html>
