<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>{{big_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--void:#05070a;--surface:rgba(0,200,255,0.04);--border:rgba(0,200,255,0.18);--accent:#00c8ff;--text:#f5f7fb;--text-2:rgba(245,247,251,0.66);--text-3:rgba(245,247,251,0.36);--terminal-bg:#0a0d14;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--void);color:var(--text);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.frame{position:relative;width:100%;height:100%;padding:64px;display:flex;flex-direction:column;gap:32px;z-index:1}
.header{display:flex;align-items:center;gap:14px}
.header .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
.header .kicker{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3)}
.headline{font-family:"Syne",sans-serif;font-weight:700;font-size:38px;line-height:1.15;letter-spacing:-0.02em;color:var(--text);max-width:95%}
.headline .accent{color:var(--accent)}
.proof-frame{flex:1;border:1px solid var(--border-hi,rgba(0,200,255,0.32));border-radius:6px;background:var(--terminal-bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 40px rgba(0,200,255,0.08)}
.proof-titlebar{padding:10px 16px;background:rgba(0,200,255,0.08);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.proof-titlebar .traffic{display:flex;gap:6px}
.proof-titlebar .traffic span{width:11px;height:11px;border-radius:50%;display:block}
.proof-titlebar .traffic .r{background:#ff5f57}
.proof-titlebar .traffic .y{background:#febc2e}
.proof-titlebar .traffic .g{background:#28c840}
.proof-titlebar .title{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-2);margin-left:10px;letter-spacing:0.05em}
.proof-body{flex:1;padding:24px 28px;font-family:"JetBrains Mono",monospace;font-size:15px;line-height:1.55;color:var(--text);white-space:pre-wrap;overflow:hidden}
.proof-body .prompt{color:var(--accent)}
.proof-body .output{color:var(--text-2)}
.proof-body .success{color:#00e676}
.proof-body .label{color:var(--text-3)}
.source{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.1em;color:var(--text-3)}
.footer{display:flex;justify-content:space-between;align-items:end;padding-top:18px;border-top:1px solid var(--border)}
.footer .brand{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--text-2);letter-spacing:0.12em}
.footer .author{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase}
</style></head>
<body>
  <div class="frame">
    <div class="header"><div class="dot"></div><div class="kicker">{{kicker}}</div></div>
    <div class="headline">{{big_title_html}}</div>
    <div class="proof-frame">
      <div class="proof-titlebar">
        <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
        <div class="title">{{proof_titlebar}}</div>
      </div>
      <div class="proof-body">{{proof_body_html}}</div>
    </div>
    <div class="source">{{source_line}}</div>
    <div class="footer"><div class="brand">{{brand}}</div><div class="author">{{author}} · {{domain}}</div></div>
  </div>
</body></html>
