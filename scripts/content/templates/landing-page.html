<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{page_title}}</title>
<style>
  :root {
    --bg: #050608;
    --grid: #0d0f12;
    --ink: #e7e9ec;
    --muted: #5a6068;
    --hairline: #15181d;
    --accent: {{accent_hex}};
    --syne: 'Syne', 'Inter Display', system-ui, sans-serif;
    --inter: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    width: 1920px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--inter);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 80px 80px;
    background-position: -1px -1px;
  }
  section {
    min-height: 1080px;
    width: 1920px;
    padding: 120px 160px;
    border-bottom: 1px solid var(--hairline);
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
  }
  .kicker {
    font-family: var(--mono); font-size: 18px; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 28px;
  }
  .kicker .dot { color: var(--accent); }
  h1, h2 {
    font-family: var(--syne); font-weight: 700;
    color: var(--ink); letter-spacing: -0.025em; line-height: 1.02;
  }
  h1 { font-size: 168px; max-width: 1500px; }
  h2 { font-size: 96px; max-width: 1300px; margin-bottom: 36px; }
  .accent { color: var(--accent); }
  p, li {
    font-family: var(--inter); font-size: 30px; line-height: 1.45; color: #cfd2d6;
    max-width: 1100px;
  }
  p + p { margin-top: 22px; }
  ul { padding-left: 28px; margin-top: 24px; }
  li + li { margin-top: 14px; }
  .footer-row {
    position: absolute; bottom: 56px; left: 160px; right: 160px;
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.16em;
    color: var(--muted); text-transform: uppercase;
  }
  .footer-row .domain { color: var(--accent); }

  .cta-link {
    display: inline-block; margin-top: 56px;
    font-family: var(--mono); font-size: 24px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
    padding: 28px 40px; border: 1px solid var(--accent);
    text-decoration: none;
    transition: background 180ms cubic-bezier(0.22,1,0.36,1);
  }
  .cta-link:hover { background: rgba(0, 200, 255, 0.08); }

  .stack {
    display: flex; flex-direction: column; gap: 16px;
    margin-top: 40px;
  }
  .layer {
    display: flex; align-items: baseline; gap: 28px;
    padding: 24px 32px;
    border: 1px solid var(--hairline);
  }
  .layer .num {
    font-family: var(--mono); font-size: 22px; color: var(--accent);
    width: 80px;
  }
  .layer .name {
    font-family: var(--syne); font-weight: 700; font-size: 38px;
    width: 360px;
  }
  .layer .desc {
    font-family: var(--inter); font-size: 22px; color: var(--muted); flex: 1;
  }
  .layer.highlight { border-color: var(--accent); }

  .terminal {
    margin-top: 40px; max-width: 1300px;
    border: 1px solid var(--hairline); background: #07090c;
    font-family: var(--mono); font-size: 22px;
    color: #cfd2d6;
  }
  .terminal .bar {
    background: #0d0f12; padding: 12px 20px;
    color: var(--muted); font-size: 14px;
    letter-spacing: 0.16em; text-transform: uppercase;
    border-bottom: 1px solid var(--hairline);
  }
  .terminal .body { padding: 24px 28px; line-height: 1.55; }
  .terminal .prompt { color: var(--accent); }
  .terminal .ok { color: #3ee07a; }
  .terminal .err { color: #ff5252; }

  .pricing-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; margin-top: 48px;
  }
  .price-card {
    border: 1px solid var(--hairline); padding: 36px 32px;
  }
  .price-card .tier {
    font-family: var(--mono); font-size: 14px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
  }
  .price-card .amount {
    font-family: var(--syne); font-weight: 700; font-size: 64px;
    color: var(--ink); margin-bottom: 8px;
  }
  .price-card .unit {
    font-family: var(--mono); font-size: 16px; color: var(--muted);
    margin-bottom: 24px; letter-spacing: 0.1em;
  }
  .price-card ul { padding-left: 22px; }
  .price-card li { font-size: 22px; }
  .price-card.featured { border-color: var(--accent); }
  .price-card.featured .amount { color: var(--accent); }

  /* Scroll-reveal — interaction-designer.md signature.
     Section starts 24px below, opacity 0; settles when 70% visible. */
  section { opacity: 0; transform: translateY(24px); transition: opacity 620ms cubic-bezier(0.22,1,0.36,1), transform 620ms cubic-bezier(0.22,1,0.36,1); }
  section.is-in { opacity: 1; transform: translateY(0); }

  /* Cyan ribbon underline that draws in on hover (interaction signature) */
  a.cta-link { position: relative; overflow: hidden; }
  a.cta-link::after {
    content: ""; position: absolute; left: 0; bottom: 0;
    width: 100%; height: 2px; background: var(--accent);
    transform: scaleX(0); transform-origin: left center;
    transition: transform 220ms cubic-bezier(0.22,1,0.36,1);
  }
  a.cta-link:hover::after { transform: scaleX(1); }

  /* Reduced motion respect */
  @media (prefers-reduced-motion: reduce) {
    section { opacity: 1; transform: none; transition: none; }
    a.cta-link::after { transition: none; }
  }

  /* Sticky progress bar — only visible when scrolling */
  .progress-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 3px; background: transparent; z-index: 100;
  }
  .progress-bar .fill {
    height: 100%; background: var(--accent);
    width: 0%; transition: width 80ms linear;
  }

  /* Section snap on full-viewport sections (hero + cta) */
  html { scroll-snap-type: y proximity; }
  section[data-section="hero"], section[data-section="cta"] { scroll-snap-align: start; }
</style>
</head>
<body>
<div class="progress-bar"><div class="fill" id="pb-fill"></div></div>
{{sections_html}}

<script>
// Scroll-reveal via IntersectionObserver. Sections marked .is-in when 30%+ visible.
(function () {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('section').forEach(function (el) { el.classList.add('is-in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('is-in');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.30 });
  document.querySelectorAll('section').forEach(function (s) { io.observe(s); });
})();

// Scroll-progress bar (fills as you scroll the page)
(function () {
  var fill = document.getElementById('pb-fill');
  if (!fill) return;
  function update() {
    var doc = document.documentElement;
    var scrolled = doc.scrollTop || document.body.scrollTop;
    var height = (doc.scrollHeight || document.body.scrollHeight) - doc.clientHeight;
    var pct = height > 0 ? (scrolled / height) * 100 : 0;
    fill.style.width = pct.toFixed(2) + '%';
  }
  window.addEventListener('scroll', update, { passive: true });
  update();
})();

// Headline emphasis flicker — letter-by-letter on first hero entry
(function () {
  var hero = document.querySelector('section[data-section="hero"] h1');
  if (!hero) return;
  // Already-rendered HTML; no destructive re-parse. Just animate opacity from 0 to 1 once.
  hero.style.opacity = '0';
  hero.style.transition = 'opacity 900ms cubic-bezier(0.22,1,0.36,1)';
  requestAnimationFrame(function () { setTimeout(function () { hero.style.opacity = '1'; }, 240); });
})();

// Keyboard navigation: arrow keys jump between sections
(function () {
  var sections = Array.prototype.slice.call(document.querySelectorAll('section'));
  if (!sections.length) return;
  function currentIndex() {
    var top = window.scrollY + 80;
    for (var i = sections.length - 1; i >= 0; i--) {
      if (sections[i].offsetTop <= top) return i;
    }
    return 0;
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j') {
      var i = currentIndex();
      if (i < sections.length - 1) { sections[i + 1].scrollIntoView({ behavior: 'smooth' }); e.preventDefault(); }
    } else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k') {
      var i = currentIndex();
      if (i > 0) { sections[i - 1].scrollIntoView({ behavior: 'smooth' }); e.preventDefault(); }
    }
  });
})();
</script>
</body>
</html>
