<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>{{big_title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--void:#05070a;--surface:rgba(0,200,255,0.04);--border:rgba(0,200,255,0.18);--accent:#00c8ff;--gold:#c9a84c;--red:#ff3d5a;--text:#f5f7fb;--text-2:rgba(245,247,251,0.66);--text-3:rgba(245,247,251,0.36);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:var(--void);color:var(--text);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.03) 1px,transparent 1px);background-size:80px 80px;pointer-events:none}
body::after{content:"";position:fixed;bottom:-300px;left:-300px;width:800px;height:800px;background:radial-gradient(circle,rgba(0,200,255,0.16) 0%,transparent 70%);pointer-events:none}
body.accent-gold::after{background:radial-gradient(circle,rgba(201,168,76,0.18) 0%,transparent 70%)}
body.accent-red::after{background:radial-gradient(circle,rgba(255,61,90,0.18) 0%,transparent 70%)}
.frame{position:relative;width:100%;height:100%;padding:96px 88px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.kicker-row{display:flex;align-items:center;gap:14px}
.kicker-row .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
body.accent-gold .kicker-row .dot{background:var(--gold);box-shadow:0 0 18px var(--gold)}
body.accent-red .kicker-row .dot{background:var(--red);box-shadow:0 0 18px var(--red)}
.kicker-row .label{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3)}
.giant-quote-mark{font-family:"Syne",serif;font-style:italic;font-size:240px;line-height:0.7;color:var(--accent);opacity:0.25;margin-bottom:-90px;margin-top:-20px}
body.accent-gold .giant-quote-mark{color:var(--gold)}
body.accent-red .giant-quote-mark{color:var(--red)}
.quote{font-family:"Syne",sans-serif;font-weight:700;font-style:italic;font-size:72px;line-height:1.1;letter-spacing:-0.02em;color:var(--text);max-width:95%}
.quote .em{color:var(--accent);font-style:italic}
body.accent-gold .quote .em{color:var(--gold)}
body.accent-red .quote .em{color:var(--red)}
.attribution{margin-top:48px;font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-2)}
.attribution::before{content:"— ";color:var(--text-3)}
.footer{display:flex;justify-content:space-between;align-items:end;padding-top:28px;border-top:1px solid var(--border)}
.footer .brand{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--text-2);letter-spacing:0.12em}
.footer .author{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase}
</style></head>
<body class="accent-{{accent_class}}">
  <div class="frame">
    <div>
      <div class="kicker-row"><div class="dot"></div><div class="label">{{kicker}}</div></div>
    </div>
    <div>
      <div class="giant-quote-mark">"</div>
      <div class="quote">{{quote_html}}</div>
      <div class="attribution">{{attribution}}</div>
    </div>
    <div class="footer"><div class="brand">{{brand}}</div><div class="author">{{author}} · {{domain}}</div></div>
  </div>
</body></html>
