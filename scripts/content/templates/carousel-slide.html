<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Slide {{slide_n}} of {{slide_total}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--void:#05070a;--surface:rgba(0,200,255,0.04);--border:rgba(0,200,255,0.18);--accent:#00c8ff;--gold:#c9a84c;--red:#ff3d5a;--amber:#ffab00;--text:#f5f7fb;--text-2:rgba(245,247,251,0.66);--text-3:rgba(245,247,251,0.36);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:var(--void);color:var(--text);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.04) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
body::after{content:"";position:fixed;top:-300px;right:-300px;width:700px;height:700px;background:radial-gradient(circle,rgba(0,200,255,0.16) 0%,transparent 70%);pointer-events:none}
body.role-cta::after{background:radial-gradient(circle,rgba(0,200,255,0.28) 0%,transparent 70%)}
body.accent-gold::after{background:radial-gradient(circle,rgba(201,168,76,0.18) 0%,transparent 70%)}
body.accent-red::after{background:radial-gradient(circle,rgba(255,61,90,0.18) 0%,transparent 70%)}
body.accent-amber::after{background:radial-gradient(circle,rgba(255,171,0,0.18) 0%,transparent 70%)}
.frame{position:relative;width:100%;height:100%;padding:80px 72px 64px;display:flex;flex-direction:column;justify-content:space-between;z-index:1}
.top-bar{display:flex;justify-content:space-between;align-items:center}
.kicker-row{display:flex;align-items:center;gap:14px}
.kicker-row .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
body.accent-gold .kicker-row .dot{background:var(--gold);box-shadow:0 0 18px var(--gold)}
body.accent-red .kicker-row .dot{background:var(--red);box-shadow:0 0 18px var(--red)}
body.accent-amber .kicker-row .dot{background:var(--amber);box-shadow:0 0 18px var(--amber)}
.kicker-row .label{font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-3)}
.slide-counter{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--text-2);letter-spacing:0.16em;padding:6px 12px;border:1px solid var(--border);border-radius:2px}
.middle{display:flex;flex-direction:column;justify-content:center;flex:1;gap:32px;padding:48px 0}
body.role-hook .middle .headline{font-size:88px;line-height:1.0;font-weight:800}
body.role-body .middle .headline{font-size:54px;line-height:1.12;font-weight:700}
body.role-turn .middle .headline{font-size:64px;line-height:1.08;font-weight:700;font-style:italic}
body.role-cta .middle .headline{font-size:56px;line-height:1.1;font-weight:700;text-align:center}
.headline{font-family:"Syne",sans-serif;letter-spacing:-0.02em;color:var(--text);max-width:92%}
.headline .accent{color:var(--accent)}
body.accent-gold .headline .accent{color:var(--gold)}
body.accent-red .headline .accent{color:var(--red)}
body.accent-amber .headline .accent{color:var(--amber)}
.body-text{font-size:22px;line-height:1.5;color:var(--text-2);max-width:88%}
body.role-cta .body-text{text-align:center;max-width:90%;margin:0 auto}
.cta-button{margin:24px auto 0;display:inline-flex;align-items:center;gap:14px;padding:20px 38px;border:2px solid var(--accent);border-radius:4px;background:rgba(0,200,255,0.08);font-family:"JetBrains Mono",monospace;font-size:18px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);align-self:center}
body.accent-gold .cta-button{border-color:var(--gold);background:rgba(201,168,76,0.08);color:var(--gold)}
.cta-button::after{content:"→";font-size:24px}
.footer{display:flex;justify-content:space-between;align-items:end;padding-top:24px;border-top:1px solid var(--border)}
.footer .brand{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--text-2);letter-spacing:0.12em}
.footer .author{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--text-3);letter-spacing:0.14em;text-transform:uppercase}
.swipe-hint{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-3)}
</style></head>
<body class="role-{{role_class}} accent-{{accent_class}}">
  <div class="frame">
    <div class="top-bar">
      <div class="kicker-row"><div class="dot"></div><div class="label">{{kicker}}</div></div>
      <div class="slide-counter">{{slide_counter}}</div>
    </div>
    <div class="middle">
      <div class="headline">{{headline_html}}</div>
      {{body_block}}
      {{cta_block}}
    </div>
    <div class="footer">
      <div class="brand">{{brand}}</div>
      <div class="swipe-hint">{{swipe_hint}}</div>
    </div>
  </div>
</body></html>
