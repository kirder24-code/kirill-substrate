<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{big_title}}</title>
<style>
  :root {
    --bg: #050608;
    --grid: #0d0f12;
    --ink: #e7e9ec;
    --muted: #5a6068;
    --hairline: #15181d;
    --accent: {{accent_hex}};
    --syne: 'Syne', 'Inter Display', system-ui, sans-serif;
    --inter: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1080px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--inter);
    overflow: hidden;
  }
  body {
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: -1px -1px;
    position: relative;
  }
  .frame {
    position: absolute; inset: 60px;
    border: 1px solid var(--hairline);
    display: flex; flex-direction: column;
    padding: 56px 64px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 36px;
  }
  .kicker {
    font-family: var(--mono); font-size: 22px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted);
  }
  .kicker .dot { color: var(--accent); }
  .title-zone {
    margin-bottom: 28px;
  }
  .big-title {
    font-family: var(--syne); font-weight: 700;
    font-size: 64px; line-height: 1.04;
    letter-spacing: -0.02em; color: var(--ink);
  }
  .accent { color: var(--accent); }
  .stage {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  .step {
    display: flex; align-items: stretch;
    border: 1px solid var(--hairline);
    padding: 24px 28px;
    opacity: 0;
    transform: translateX(-24px);
    animation: step-in 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .step .num {
    font-family: var(--mono); font-size: 22px; color: var(--accent);
    width: 76px; padding-top: 4px;
  }
  .step .body {
    flex: 1;
  }
  .step .label {
    font-family: var(--syne); font-weight: 700;
    font-size: 32px; color: var(--ink);
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .step .desc {
    font-family: var(--inter); font-size: 18px;
    color: var(--muted); line-height: 1.4;
  }
  .step .arrow {
    width: 56px; display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: 24px;
    opacity: 0;
    animation: arrow-in 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid var(--hairline);
    padding-top: 22px; margin-top: 18px;
    font-family: var(--mono); font-size: 18px;
    letter-spacing: 0.12em; color: var(--muted);
    text-transform: uppercase;
  }
  .footer .domain { color: var(--accent); }

  @keyframes step-in {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes arrow-in {
    0%   { opacity: 0; transform: scaleX(0); }
    100% { opacity: 1; transform: scaleX(1); }
  }

  /* Outer loop wrapper: hold all-visible state, then fade and restart */
  .loop-wrap {
    width: 100%; height: 100%;
    animation: loop {{duration_sec}}s linear infinite;
  }
  @keyframes loop {
    0%   { opacity: 1; }
    {{fade_out_at}}% { opacity: 1; }
    {{fade_done_at}}% { opacity: 0; }
    {{reset_at}}%    { opacity: 0; }
    100% { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="loop-wrap">
    <div class="frame">
      <div class="header">
        <div class="kicker">{{kicker}}<span class="dot"> ·</span> {{kicker_tag}}</div>
      </div>
      <div class="title-zone">
        <div class="big-title">{{big_title_html}}</div>
      </div>
      <div class="stage">
        {{steps_html}}
      </div>
      <div class="footer">
        <span>{{brand}}</span>
        <span class="domain">{{domain}}</span>
      </div>
    </div>
  </div>
</body>
</html>
